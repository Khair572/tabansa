<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin - TABANSA</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><meta name="theme-color" content="#2547C7">
<script src="../theme.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><div class="login"><div class="card">
<img src="icon.png" alt=""><h1 style="margin:12px 0 2px;font-size:26px">Masuk Admin</h1><p class="mut" style="margin:0 0 18px">Kelola tabungan santri TABANSA.</p>
<form id="f" class="f"><div><label for="e">Email</label><input id="e" type="email" class="inp" required autocomplete="username"></div>
<div><label for="p">Kata sandi</label><input id="p" type="password" class="inp" required autocomplete="current-password"></div>
<p id="err" role="alert" class="out" style="margin:0" hidden></p><button id="b" class="btn" style="padding:11px">Masuk</button></form>
<p style="text-align:center;margin:16px 0 0;font-size:13px"><a href="../index.html" class="mut">&larr; Kembali ke halaman TABANSA</a></p>
</div></div>
<script src="../config.js"></script>
<script>
sb.auth.getSession().then(({data})=>{if(data.session)location.href="admin.html"});
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("b"),er=document.getElementById("err");er.hidden=true;b.disabled=true;b.textContent="Memproses...";
 const{error}=await sb.auth.signInWithPassword({email:document.getElementById("e").value,password:document.getElementById("p").value});
 if(error){er.textContent="Email atau kata sandi salah.";er.hidden=false;b.disabled=false;b.textContent="Masuk"}else location.href="admin.html"};
</script></body></html>
