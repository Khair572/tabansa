<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - TABANSA</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#12263F">
<script src="../theme.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body>
<header class="top"><div class="wrap">
 <a class="brand" href="admin.html"><img src="icon.svg" alt=""><span><b>TABANSA</b><small id="me">Admin</small></span></a>
 <div class="acts"><button class="ibtn" data-theme-toggle type="button"></button><a class="tlink" href="../index.html">Halaman publik</a><button class="ibtn" id="out" type="button">Keluar</button></div>
</div></header>
<section class="hero" style="padding-bottom:56px"><div class="wrap"><p>Total tabungan seluruh santri</p><div class="big num" id="total" style="font-size:clamp(2rem,6vw,3rem)">Rp 0</div><div class="mini" id="mini"></div></div></section>
<div class="wrap adm">
 <form class="card pad kasir" id="ft">
  <h2 class="disp" style="font-size:1.25rem;margin-bottom:12px">Catat transaksi</h2>
  <div class="seg"><button type="button" class="m" data-j="masuk" aria-pressed="true">Setoran</button><button type="button" class="k" data-j="keluar" aria-pressed="false">Penarikan</button></div>
  <label class="f"><span>NIS santri</span><input class="in" id="tNis" list="nisList" required autocomplete="off" inputmode="numeric" placeholder="Ketik NIS"><datalist id="nisList"></datalist></label>
  <div class="idc" id="tInfo">Masukkan NIS untuk melihat nama dan saldo.</div>
  <label class="f"><span>Jumlah (Rp)</span><input class="in num" id="tJml" type="number" min="1" step="1" required style="font-size:1.3rem;font-weight:700"></label>
  <div class="q" id="quick"></div>
  <label class="f"><span>Tanggal</span><input class="in" id="tTgl" type="date" required></label>
  <label class="f"><span>Keterangan (opsional)</span><input class="in" id="tKet"></label>
  <button class="btn" id="tBtn" style="width:100%">Simpan setoran</button>
 </form>
 <div class="card">
  <div class="bar"><input class="in" id="q" type="search" placeholder="Cari NIS, nama, atau alamat" aria-label="Cari santri"><button class="btn" id="add" type="button">Tambah santri</button><button class="btn soft" id="dlS" type="button">CSV saldo</button><button class="btn soft" id="dlT" type="button">CSV transaksi</button></div>
  <div id="list"></div><p class="empty" id="empty" hidden>Belum ada santri. Klik "Tambah santri" untuk memulai.</p>
  <div style="text-align:center;padding:12px"><button class="btn soft" id="more" hidden>Tampilkan lebih banyak</button></div>
 </div>
</div>
<dialog class="sheet" id="shS"><form id="fs" style="display:flex;flex-direction:column;height:100%"><div class="shh"><div><h3 id="sT"></h3><small>Data santri</small></div><button class="x" type="button" aria-label="Tutup" onclick="shS.close()">&times;</button></div>
 <div class="shb" style="padding:18px 20px"><label class="f"><span>NIS</span><input class="in" id="sNis" required></label><label class="f"><span>Nama</span><input class="in" id="sNama" required></label><label class="f"><span>Alamat</span><input class="in" id="sAlamat"></label><button class="btn" style="width:100%">Simpan santri</button></div></form></dialog>
<dialog class="sheet" id="shR"><div class="shh"><div><h3 id="rN"></h3><small id="rS"></small></div><button class="x" type="button" aria-label="Tutup" onclick="shR.close()">&times;</button></div>
 <div class="shb"><div class="sum" id="rSum"></div><div id="rLed"></div></div></dialog>
<script src="../config.js"></script><script src="../common.js"></script>
<script>
let S=[],shown=50,J="masuk",editNis=null,curNis=null;
(async()=>{const{data:{session}}=await sb.auth.getSession();if(!session){location.href="login.html";return}
 $("#me").textContent=session.user.email;$("#tTgl").value=hariIni();load()})();
sb.auth.onAuthStateChange(e=>{if(e==="SIGNED_OUT")location.href="login.html"});
$("#out").onclick=()=>sb.auth.signOut();
$("#quick").innerHTML=[5000,10000,20000,50000,100000].map(v=>`<button type="button" class="chip" data-v="${v}">+${v/1000}rb</button>`).join("");
$("#quick").onclick=e=>{const b=e.target.closest("[data-v]");if(b)$("#tJml").value=Number($("#tJml").value||0)+Number(b.dataset.v)};
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{J=b.dataset.j;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#tBtn").textContent=J==="masuk"?"Simpan setoran":"Simpan penarikan"});
async function load(){const{data,error}=await sb.from("saldo_santri").select("*").order("nama");if(error)return toast(error.message,1);
 S=data||[];const sum=k=>S.reduce((t,x)=>t+Number(x[k]),0);$("#total").textContent=rp(sum("saldo"));
 $("#mini").innerHTML=[["Santri",S.length],["Total setoran",rp(sum("total_masuk"))],["Total penarikan",rp(sum("total_keluar"))]].map(([l,v])=>`<div><b class="num">${v}</b><span>${l}</span></div>`).join("");
 $("#nisList").innerHTML=S.map(x=>`<option value="${esc(x.nis)}">${esc(x.nama)}</option>`).join("");render();cekNis()}
const filtered=()=>{const q=$("#q").value.toLowerCase();return S.filter(x=>(x.nis+" "+x.nama+" "+(x.alamat||"")).toLowerCase().includes(q))};
function render(){const d=filtered();$("#empty").hidden=d.length>0;$("#more").hidden=d.length<=shown;
 $("#list").innerHTML=d.slice(0,shown).map(x=>`<div class="row" style="cursor:default;flex-wrap:wrap"><span class="av">${inisial(x.nama)}</span><span class="grow"><b>${esc(x.nama)}</b><small>NIS ${esc(x.nis)}${x.alamat?" · "+esc(x.alamat):""}</small></span><span class="amt num">${rp(x.saldo)}</span>
 <span style="display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-left:54px"><button class="sbtn pri" onclick="pakai('${esc(x.nis)}')">Catat</button><button class="sbtn" onclick="riwayat('${esc(x.nis)}')">Riwayat</button><button class="sbtn" onclick="ubah('${esc(x.nis)}')">Edit</button><button class="sbtn dng" onclick="hapusS('${esc(x.nis)}')">Hapus</button></span></div>`).join("")}
$("#q").oninput=()=>{shown=50;render()};$("#more").onclick=()=>{shown+=50;render()};
function cekNis(){const v=$("#tNis").value.trim(),x=S.find(s=>s.nis===v);
 $("#tInfo").innerHTML=!v?"Masukkan NIS untuk melihat nama dan saldo.":x?`<b>${esc(x.nama)}</b><br><span class="mut">Saldo saat ini</span> <b class="num">${rp(x.saldo)}</b>`:'<span class="neg">NIS tidak ditemukan.</span>';return x}
$("#tNis").oninput=cekNis;
function pakai(nis){$("#tNis").value=nis;cekNis();$("#ft").scrollIntoView({behavior:"smooth",block:"center"});$("#tJml").focus()}
$("#ft").onsubmit=async e=>{e.preventDefault();const x=cekNis();if(!x)return toast("NIS tidak ditemukan.",1);const jumlah=Number($("#tJml").value);
 if(J==="keluar"&&jumlah>Number(x.saldo))return toast("Saldo tidak cukup. Saldo saat ini "+rp(x.saldo),1);
 $("#tBtn").disabled=true;const{error}=await sb.from("transaksi").insert({nis:x.nis,jenis:J,jumlah,tanggal:$("#tTgl").value,keterangan:$("#tKet").value.trim()||null});$("#tBtn").disabled=false;
 if(error)return toast(error.message,1);toast((J==="masuk"?"Setoran ":"Penarikan ")+rp(jumlah)+" · "+x.nama);$("#tJml").value="";$("#tKet").value="";load()};
function bukaS(x){editNis=x?x.nis:null;$("#sT").textContent=x?"Edit santri":"Tambah santri";$("#sNis").value=x?.nis||"";$("#sNama").value=x?.nama||"";$("#sAlamat").value=x?.alamat||"";shS.showModal()}
$("#add").onclick=()=>bukaS();const ubah=nis=>bukaS(S.find(s=>s.nis===nis));
$("#fs").onsubmit=async e=>{e.preventDefault();const v={nis:$("#sNis").value.trim(),nama:$("#sNama").value.trim(),alamat:$("#sAlamat").value.trim()||null};
 const{error}=editNis?await sb.from("santri").update(v).eq("nis",editNis):await sb.from("santri").insert(v);
 if(error)return toast(error.code==="23505"?"NIS sudah terdaftar.":error.message,1);shS.close();toast("Data santri tersimpan.");load()};
async function hapusS(nis){const x=S.find(s=>s.nis===nis);if(!confirm("Hapus "+x.nama+" (NIS "+nis+") beserta SEMUA riwayat transaksinya? Tidak bisa dibatalkan."))return;
 const{error}=await sb.from("santri").delete().eq("nis",nis);if(error)return toast(error.message,1);toast("Santri dihapus.");load()}
async function riwayat(nis){curNis=nis;const x=S.find(s=>s.nis===nis);$("#rN").textContent=x.nama;$("#rS").textContent="NIS "+x.nis;$("#rSum").innerHTML=sumBox(x);
 $("#rLed").innerHTML='<p class="empty">Memuat...</p>';if(!shR.open)shR.showModal();
 const{data}=await sb.from("transaksi").select("*").eq("nis",nis);$("#rLed").innerHTML=ledger(data||[]).map(r=>ledRow(r,true)).join("")||'<p class="empty">Belum ada transaksi.</p>'}
async function hapusT(id){if(!confirm("Hapus transaksi ini? Saldo dihitung ulang."))return;const{error}=await sb.from("transaksi").delete().eq("id",id);if(error)return toast(error.message,1);toast("Transaksi dihapus.");await load();riwayat(curNis)}
$("#dlS").onclick=()=>csv("tabansa-saldo.csv",[["NIS","Nama","Alamat","Total Setoran","Total Penarikan","Saldo"],...S.map(x=>[x.nis,x.nama,x.alamat,x.total_masuk,x.total_keluar,x.saldo])]);
$("#dlT").onclick=async()=>{const{data,error}=await sb.from("transaksi").select("*,santri(nama)").order("tanggal",{ascending:false}).limit(10000);if(error)return toast(error.message,1);
 csv("tabansa-transaksi.csv",[["Tanggal","NIS","Nama","Jenis","Jumlah","Keterangan","Admin"],...data.map(r=>[r.tanggal,r.nis,r.santri?.nama,r.jenis==="masuk"?"Setoran":"Penarikan",r.jumlah,r.keterangan,r.admin_email])])};
</script></body></html>
