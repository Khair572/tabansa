<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · TABANSA</title><link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head>
<body>
<header><h1>TABANSA</h1><div><a href="index.html" style="color:#fff;margin-right:.5rem">Halaman publik</a><small id="user"></small> <button class="btn sm alt" id="logout">Keluar</button></div></header>
<nav><button data-t="dash" class="on">Ringkasan</button><button data-t="santri">Data Santri</button><button data-t="trx">Catat Transaksi</button><button data-t="riwayat">Riwayat per NIS</button></nav>
<main>
<section id="dash"><div class="cards" id="cards"></div>
<div class="box"><h3>Transaksi terbaru</h3><div class="tw" id="recent"></div></div></section>

<section id="santri" hidden>
<div class="box"><h3>Tambah santri</h3><form id="fs" class="row">
<div><label>NIS</label><input id="s_nis" required></div><div><label>Nama</label><input id="s_nama" required></div>
<div><label>Kelas</label><input id="s_kelas"></div><button class="btn">Simpan santri</button></form></div>
<div class="box"><div class="row" style="margin-bottom:.6rem"><div><label>Cari NIS / nama</label><input id="q" placeholder="Ketik untuk mencari"></div></div>
<div class="tw" id="list"></div></div></section>

<section id="trx" hidden><div class="box"><h3>Catat transaksi</h3>
<form id="ft" class="row">
<div><label>NIS</label><input id="t_nis" required></div>
<div><label>Jenis</label><select id="t_jenis"><option value="masuk">Setoran (masuk)</option><option value="keluar">Penarikan (keluar)</option></select></div>
<div><label>Jumlah (Rp)</label><input id="t_jml" type="number" min="1" required></div>
<div><label>Tanggal</label><input id="t_tgl" type="date" required></div>
<div><label>Keterangan</label><input id="t_ket"></div>
<button class="btn">Simpan transaksi</button></form>
<p class="info" id="t_info">Masukkan NIS untuk melihat nama dan saldo.</p></div></section>

<section id="riwayat" hidden><div class="box noprint"><div class="row">
<div><label>NIS</label><input id="r_nis" placeholder="Masukkan NIS"></div><button class="btn" id="r_go">Tampilkan</button><button class="btn alt" onclick="window.print()">Cetak</button></div></div>
<div class="box" id="r_out"><p class="empty">Masukkan NIS untuk melihat riwayat.</p></div></section>
</main>
<script src="js/config.js"></script><script src="js/app.js"></script></body></html>
