<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TABANSA - Tabungan Santri</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><meta name="theme-color" content="#2547C7">
<script src="theme.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<script src="supabase.js"></script></head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="index.html"><img src="icon.png" alt=""><span><b>TABANSA</b><small id="lem"></small></span></a>
<div class="acts"><button class="ib" data-theme-toggle aria-label="Ganti tema terang/gelap" title="Ganti tema">&#9680;</button><a class="btn btn-sm" href="admin/login.html">Login admin</a></div></div></header>
<section class="hero"><div class="wrap"><p>Total tabungan seluruh santri</p><h1 id="hSaldo" class="num">Rp 0</h1></div></section>
<main class="wrap">
<div class="chips" id="chips"></div>
<section class="card"><h2>Transaksi per periode</h2><div id="periode"></div></section>
<section class="card"><div class="bar"><h2>Data tabungan santri</h2><button id="dl" class="btn btn-ghost btn-sm">Unduh CSV</button></div>
<div class="bar" id="flt"></div>
<div class="tw only-w"><table><thead><tr><th>No</th><th>NIS</th><th>Nama</th><th>Alamat</th><th>Tgl Masuk</th><th>Tgl Keluar</th><th>Ket</th><th>Status</th><th class="r">Saldo</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="only-n" id="cards"></div>
<p id="empty" class="empty" hidden></p><div style="text-align:center;margin-top:12px"><button id="more" class="btn btn-ghost" hidden>Tampilkan lebih banyak</button></div></section>
</main>
<div class="modal" id="modal" hidden><div class="sheet"><button class="ib x" id="mx" aria-label="Tutup">&times;</button><h3 id="mN"></h3><p class="mut" id="mI" style="margin:0"></p><div class="sum" id="mS"></div><div id="mL"></div></div></div>
<script src="config.js"></script><script src="common.js"></script>
<script>
let S=[],shown=40,muatPeriode;
initNet();$("#lem").textContent=NAMA_LEMBAGA;$("#flt").innerHTML=FILTER_HTML;muatPeriode=initPeriode($("#periode"));
const chip=(l,v,c)=>`<div class="chip ${c||""}"><span>${l}</span><b>${v}</b></div>`;
async function load(){const{data,error}=await cq("saldo",sb.from("saldo_santri").select("*"));
 if(error){$("#empty").hidden=false;$("#empty").textContent=errJaringan(error)?"Belum ada data tersimpan. Sambungkan internet sekali untuk memuat data.":"Data belum bisa dimuat: "+error.message;return}
 S=data||[];const sum=k=>S.reduce((t,x)=>t+Number(x[k]),0);$("#hSaldo").textContent=rp(sum("saldo"));
 $("#chips").innerHTML=chip("Total santri",S.length)+chip("Santri aktif",S.filter(x=>x.aktif).length)+chip("Total setoran",rp(sum("total_masuk")),"in")+chip("Total penarikan",rp(sum("total_keluar")),"out");render()}
const lihat=()=>filterSantri(S,$("#q").value,$("#fSt").value,$("#fSa").value,$("#fSo").value);
function render(){const d=lihat(),v=d.slice(0,shown);$("#empty").hidden=d.length>0;$("#empty").textContent=S.length?"Tidak ada santri yang cocok.":"Belum ada data santri.";$("#more").hidden=d.length<=shown;
 $("#tb").innerHTML=v.map((x,i)=>`<tr class="klik" data-nis="${esc(x.nis)}"><td class="mut">${i+1}</td><td class="nw">${esc(x.nis)}</td><td class="nw"><span class="av">${inisial(x.nama)}</span><b>${esc(x.nama)}</b></td><td>${esc(x.alamat||"-")}</td><td class="nw">${tgl(x.tanggal_masuk)}</td><td class="nw">${tgl(x.tanggal_keluar)}</td><td>${esc(x.keterangan||"-")}</td><td>${statusPill(x)}</td><td class="r nw"><b>${rp(x.saldo)}</b></td></tr>`).join("");
 $("#cards").innerHTML=v.map(x=>`<button class="scard" data-nis="${esc(x.nis)}"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(x.nama)}</b><br><small class="mut">NIS ${esc(x.nis)}${x.alamat?" · "+esc(x.alamat):""}</small></div>${statusPill(x)}</div><div class="num">${rp(x.saldo)}</div></button>`).join("")}
["q","fSt","fSa","fSo"].forEach(i=>$("#"+i).addEventListener("input",()=>{shown=40;render()}));$("#more").onclick=()=>{shown+=40;render()};
$("#dl").onclick=()=>csv("tabansa-saldo.csv",[["NIS","Nama","Alamat","Tgl Masuk","Tgl Keluar","Keterangan","Status","Total Setoran","Total Penarikan","Saldo"],...lihat().map(x=>[x.nis,x.nama,x.alamat,x.tanggal_masuk,x.tanggal_keluar,x.keterangan,x.aktif?"Aktif":"Tidak aktif",x.total_masuk,x.total_keluar,x.saldo])]);
async function detail(nis){const x=S.find(s=>s.nis===nis);if(!x)return;$("#mN").textContent=x.nama;
 $("#mI").textContent="NIS "+x.nis+(x.alamat?" · "+x.alamat:"")+" · masuk "+tgl(x.tanggal_masuk)+(x.tanggal_keluar?" · keluar "+tgl(x.tanggal_keluar):"");
 $("#mS").innerHTML=[["Setoran",rp(x.total_masuk),"in"],["Penarikan",rp(x.total_keluar),"out"],["Saldo",rp(x.saldo),""]].map(([l,v,c])=>`<div><span>${l}</span><b class="${c}">${v}</b></div>`).join("");
 $("#mL").innerHTML='<p class="empty">Memuat...</p>';$("#modal").hidden=false;
 const{data,error}=await cq("trx:"+nis,sb.from("transaksi").select("*").eq("nis",nis).order("tanggal",{ascending:false}).order("created_at",{ascending:false}));
 $("#mL").innerHTML=error?'<p class="empty">Riwayat belum tersimpan di perangkat. Buka saat online sekali.</p>':(data||[]).map(r=>trxRow(r,false)).join("")||'<p class="empty">Belum ada transaksi.</p>'}
document.addEventListener("click",e=>{const r=e.target.closest("[data-nis]");if(r)detail(r.dataset.nis)});
$("#mx").onclick=()=>$("#modal").hidden=true;$("#modal").onclick=e=>{if(e.target.id==="modal")e.target.hidden=true};
load();sb.channel("pub").on("postgres_changes",{event:"*",schema:"public"},()=>{load();muatPeriode()}).on("postgres_changes",{event:"INSERT",schema:"public",table:"transaksi"},p=>notifTrx(p.new)).subscribe(setRT);window.onBack=()=>{load();muatPeriode()};
</script></body></html>
